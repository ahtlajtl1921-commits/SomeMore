<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설렘 한 편 | 커스텀 모임 신청</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f9f9f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="p-5">

<div class="max-w-md mx-auto bg-white rounded-3xl shadow-lg overflow-hidden border border-gray-100">
    <div class="bg-rose-500 p-6 text-white text-center">
        <h1 class="text-xl font-bold">인연을 선택하세요</h1>
        <p class="text-sm opacity-80">이미 가입하셨다면 날짜만 선택하세요!</p>
    </div>

    <div class="p-6">
        <div id="auth-section" class="mb-6 text-center">
            <button onclick="showStep('step-register')" class="text-sm text-gray-500 underline">처음 오셨나요? (사진 등록)</button>
            <button onclick="showStep('step-order')" class="ml-4 text-sm font-bold text-rose-500 underline">기존 회원 신청하기</button>
        </div>

        <div id="step-register" class="tab-content space-y-4">
            <h2 class="font-bold border-b pb-2">회원정보 등록 (최초 1회)</h2>
            <input type="text" placeholder="성함" class="w-full p-3 border rounded-xl">
            <div>
                <label class="block text-xs text-gray-400 mb-1">본인 인증 사진 업로드</label>
                <input type="file" class="w-full text-sm">
            </div>
            <button onclick="saveAndGo()" class="w-full bg-black text-white py-3 rounded-xl">등록 후 날짜 선택하기</button>
        </div>

        <div id="step-order" class="tab-content active space-y-6">
            <h2 class="font-bold border-b pb-2 text-gray-800">모임 옵션 선택</h2>
            
            <div>
                <label class="block text-sm font-semibold mb-2">1. 참여 지역</label>
                <select class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-rose-400">
                    <option>광주 광역시</option>
                    <option>대전 광역시</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">2. 참여 날짜 (기수)</label>
                <div class="grid grid-cols-1 gap-2">
                    <label class="border p-3 rounded-xl flex justify-between items-center cursor-pointer hover:bg-rose-50 border-rose-100">
                        <input type="radio" name="date" class="accent-rose-500">
                        <span class="text-sm font-medium">3/15(토) 오후 4시 [137기]</span>
                        <span class="text-xs text-rose-500 font-bold">모집중</span>
                    </label>
                    <label class="border p-3 rounded-xl flex justify-between items-center cursor-pointer hover:bg-rose-50">
                        <input type="radio" name="date" class="accent-rose-500">
                        <span class="text-sm font-medium text-gray-400">3/22(토) 오후 4시 [138기]</span>
                        <span class="text-xs text-gray-400 font-bold">마감</span>
                    </label>
                </div>
            </div>

            <div class="bg-gray-50 p-4 rounded-xl">
                <div class="flex justify-between text-sm mb-1">
                    <span>참여 비용</span>
                    <span>45,000원</span>
                </div>
                <div class="flex justify-between font-bold text-rose-600">
                    <span>최종 결제 금액</span>
                    <span>45,000원</span>
                </div>
            </div>

            <button onclick="alert('결제 페이지로 이동합니다.')" class="w-full bg-rose-500 text-white py-4 rounded-xl font-bold text-lg shadow-lg">
                간편 신청하기
            </button>
        </div>
    </div>
</div>

<script>
    function showStep(stepId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.getElementById(stepId).classList.add('active');
    }

    function saveAndGo() {
        alert('회원 정보가 안전하게 저장되었습니다.');
        showStep('step-order');
    }
</script>

</body>
</html>
